[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coach"
version = "0.1.0"
description = "Curriculum-paced learning workspace for senior engineers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "openai>=1.0.0",
  "pydantic>=2.6.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
coach = "coach.cli:app"

[tool.setuptools]
packages = [
  "coach",
  "coach.providers",
  "coach.stages",
  "curriculum",
]

[tool.setuptools.package-data]
coach = ["prompts/*.md", "assets/*.png", "assets/illustrations/*.svg"]
curriculum = ["prompts/*.md"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = [
  "coach/tests",
  "coach/stages/tests",
  "coach/providers/tests",
  "curriculum/tests",
]
